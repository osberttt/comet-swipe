<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Comet Swipe prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b24; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; }
  #gear { position: fixed; right: 10px; bottom: 10px; width: 46px; height: 46px; border-radius: 23px;
    border: 0; background: #ffffff22; color: #fff; font-size: 22px; z-index: 5; cursor: pointer; }
  #panel { position: fixed; right: 10px; bottom: 64px; width: 270px; max-height: 72vh; overflow: auto;
    background: #141433ee; color: #dde; font: 12px system-ui, sans-serif; padding: 10px 12px;
    border-radius: 10px; display: none; z-index: 5; touch-action: pan-y; }
  #panel label { display: flex; justify-content: space-between; margin: 7px 0 1px; }
  #panel input[type=range] { width: 100%; }
  #panel button, #panel select { margin: 6px 4px 0 0; font: 12px system-ui, sans-serif; }
  #panel .info { color: #9af; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="gear" title="Tuning (`)">⚙</button>
<div id="panel"></div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Comet Swipe — gameplay prototype (M0 toy). Single file, no build step.
// World units: 720x1280 portrait safe area. Play area: x 20..700, y 120..1260.
// ---------------------------------------------------------------------------
const SW = 720, SH = 1280, R = 22, GOAL_R = 40, BUMPER_R = 38;

// Feel numbers (tunable in the panel; saved per browser).
const DEF = {
  speed: 1500,    // launch speed on every swipe (u/s): each swipe resets to full speed
  drag: 1.0,      // exponential drag (1/s): the gradual slow-down
  decel: 150,     // constant decel (u/s²): makes it actually stop
  stop: 25,       // below this speed the comet rests
  bounce: 0.8,    // wall restitution (normal)
  tangent: 0.97,  // wall slide speed kept
  bumper: 1300,   // min speed out of a bumper
  nebDrag: 4,     // inside a nebula: drag × this
  nebDecel: 3,    // inside a nebula: decel × this
  swipePx: 26,    // finger travel (CSS px) that fires a swipe — fires mid-drag, no release needed
  turnDeg: 35,    // while still dragging, a new swipe fires when direction changes by more than this
  snap: 0,        // 0 = free angle, 8 = 8 directions, 4 = 4 directions
};
const T = Object.assign({}, DEF);
try { const s = JSON.parse(localStorage.getItem('comet-proto.tune') || 'null'); if (s) Object.assign(T, s); } catch (e) {}
function saveTune() { try { localStorage.setItem('comet-proto.tune', JSON.stringify(T)); } catch (e) {} }
let best = {};
try { best = JSON.parse(localStorage.getItem('comet-proto.best') || '{}') || {}; } catch (e) {}
function saveBest() { try { localStorage.setItem('comet-proto.best', JSON.stringify(best)); } catch (e) {} }

// ---------------------------------------------------------------------------
// Rooms (hand-made). Rects are {x,y,w,h}. Spikes are non-solid: touching = death.
// ---------------------------------------------------------------------------
const OUTER = [
  { x: 0, y: 100, w: 720, h: 20 }, { x: 0, y: 1260, w: 720, h: 20 },
  { x: 0, y: 100, w: 20, h: 1180 }, { x: 700, y: 100, w: 20, h: 1180 },
];
// route = the intended waypoints (used by tools/bot.js; the last one is the goal).
// par = swipes the noise-free bot needs on that route (set from `node tools/bot.js`).
const r = (x, y, w, h) => ({ x, y, w, h });
const ROOMS = [
  // --- 1-3: swipe, aim, turn (no hazards)
  { name: 'Fling', par: 1, start: [360, 1140], goal: [360, 260], route: [] },
  { name: 'Angle', par: 1, start: [170, 1140], goal: [550, 300], route: [] },
  { name: 'Corner', par: 3, start: [120, 1140], goal: [120, 300],
    walls: [r(20, 640, 500, 40)], route: [[610, 1140], [610, 320]] },
  // --- 4: breather with more turns
  { name: 'Zig', par: 4, start: [110, 1150], goal: [110, 300],
    walls: [r(20, 860, 480, 40), r(220, 520, 480, 40)], route: [[610, 1150], [610, 700], [110, 700]] },
  // --- 5-7: spikes
  { name: 'Crystals', par: 1, start: [360, 1140], goal: [360, 260],
    spikes: [r(20, 680, 230, 28), r(470, 680, 230, 28)], route: [] },
  { name: 'Dodge', par: 2, start: [360, 1140], goal: [360, 260],
    spikes: [r(260, 700, 200, 28)], route: [[100, 880]] },
  { name: 'Weave', par: 3, start: [360, 1140], goal: [360, 260],
    spikes: [r(20, 520, 210, 28), r(490, 520, 210, 28), r(280, 860, 160, 28)], route: [[100, 1000], [360, 640]] },
  // --- 8-9: timing a turn
  { name: 'Bank shot', par: 2, start: [610, 1140], goal: [120, 280],
    walls: [r(20, 700, 500, 40)], spikes: [r(20, 760, 26, 480), r(580, 120, 120, 26)], route: [[610, 500]] },
  { name: 'Snake', par: 7, start: [110, 1150], goal: [110, 280],
    walls: [r(20, 960, 480, 30), r(220, 720, 480, 30), r(20, 480, 480, 30)],
    spikes: [r(674, 560, 26, 130)],
    route: [[600, 1140], [600, 850], [130, 850], [130, 620], [585, 620], [585, 330]] },
  // --- 10: breather
  { name: 'Shelf', par: 2, start: [360, 1140], goal: [360, 250],
    walls: [r(200, 400, 320, 30)], route: [[100, 420]] },
  // --- 11-14: bumpers
  { name: 'Boing', par: 2, start: [360, 1140], goal: [360, 260],
    bumpers: [[360, 700], [180, 520], [540, 520]], route: [[200, 900]] },
  { name: 'Pinball', par: 2, start: [360, 1140], goal: [600, 250],
    spikes: [r(674, 820, 26, 220), r(20, 120, 260, 26), r(20, 146, 26, 250)],
    bumpers: [[200, 700], [520, 600], [360, 900], [160, 420], [420, 380]], route: [[600, 1140]] },
  { name: 'Alley', par: 2, start: [120, 1140], goal: [360, 260],
    spikes: [r(20, 760, 250, 28), r(450, 760, 250, 28)], bumpers: [[150, 500], [570, 500]], route: [[360, 1000]] },
  { name: 'Flipper', par: 4, start: [130, 1150], goal: [600, 260],
    spikes: [r(20, 900, 260, 28), r(460, 900, 240, 28), r(20, 560, 330, 28), r(530, 560, 170, 28)],
    bumpers: [[600, 740], [150, 740]], route: [[370, 1100], [440, 740], [440, 420]] },
  // --- 15-17: nebula (heavy drag)
  { name: 'Nebula', par: 2, start: [360, 1140], goal: [360, 260],
    neb: [r(20, 500, 680, 300)], route: [] },
  { name: 'Brake', par: 3, start: [110, 1140], goal: [560, 280],
    spikes: [r(674, 120, 26, 1140)], neb: [r(380, 980, 294, 280)], route: [[560, 1140]] },
  { name: 'Soft snake', par: 7, start: [110, 1150], goal: [110, 280],
    walls: [r(20, 960, 480, 30), r(220, 720, 480, 30), r(20, 480, 480, 30)],
    spikes: [r(20, 770, 26, 170), r(674, 530, 26, 170)], neb: [r(46, 750, 174, 210), r(590, 510, 84, 210)],
    route: [[600, 1140], [600, 850], [130, 850], [130, 620], [600, 620], [600, 330]] },
  // --- 18: peak (old room 7, rebuilt: 190-wide gaps, rows 310 apart)
  { name: 'Gauntlet', par: 5, start: [360, 1140], goal: [505, 220],
    spikes: [r(20, 950, 250, 28), r(460, 950, 240, 28), r(20, 640, 100, 28), r(310, 640, 390, 28),
             r(20, 340, 390, 28), r(600, 340, 100, 28)],
    route: [[360, 800], [215, 760], [215, 500], [505, 480]] },
  // --- 19: breather (fun chaos)
  { name: 'Bumper party', par: 3, start: [360, 1140], goal: [360, 260],
    spikes: [r(20, 120, 200, 26), r(500, 120, 200, 26)],
    bumpers: [[180, 900], [360, 800], [540, 900], [180, 600], [540, 600], [360, 500]], route: [[110, 1000], [110, 420]] },
  // --- 20: finale, everything together
  { name: 'Comet run', par: 5, start: [110, 1150], goal: [600, 250],
    walls: [r(20, 980, 480, 30)],
    spikes: [r(674, 1010, 26, 250), r(20, 620, 355, 28), r(525, 620, 175, 28), r(20, 380, 300, 28), r(300, 120, 260, 26)],
    bumpers: [[300, 800], [585, 770]], neb: [r(520, 1010, 154, 250)],
    route: [[600, 1140], [600, 900], [450, 760], [450, 450]] },
];
for (const rm of ROOMS) { rm.walls = rm.walls || []; rm.spikes = rm.spikes || []; rm.bumpers = rm.bumpers || []; rm.neb = rm.neb || []; }

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let roomIdx = 0, room = null, walls = [], swipes = 0, deaths = 0;
let state = 'play', stateT = 0, clearStars = 0, time = 0;
const comet = { x: 0, y: 0, dx: 0, dy: -1, s: 0, chain: 0, sq: 0, sqNx: 1, sqNy: 0, stretch: 0, scale: 1 };
const trail = [];
const particles = [];
const bumpFlash = [];
let trauma = 0;

function loadRoom(i) {
  roomIdx = (i + ROOMS.length) % ROOMS.length;
  room = ROOMS[roomIdx];
  walls = OUTER.concat(room.walls);
  comet.x = room.start[0]; comet.y = room.start[1];
  comet.dx = 0; comet.dy = -1; comet.s = 0; comet.chain = 0; comet.sq = 0; comet.stretch = 0; comet.scale = 1;
  swipes = 0; state = 'play'; stateT = 0; trail.length = 0;
  bumpFlash.length = 0; for (let k = 0; k < room.bumpers.length; k++) bumpFlash.push(0);
}

function snapDir(dx, dy) {
  if (!T.snap) return [dx, dy];
  const step = Math.PI * 2 / T.snap;
  const a = Math.round(Math.atan2(dy, dx) / step) * step;
  return [Math.cos(a), Math.sin(a)];
}

function swipe(dx, dy) {
  if (state !== 'play') return;
  const l = Math.hypot(dx, dy); if (l < 1e-6) return;
  [dx, dy] = snapDir(dx / l, dy / l);
  comet.dx = dx; comet.dy = dy; comet.s = T.speed;   // instant turn, full speed
  comet.chain = 0; comet.stretch = 1;
  swipes++;
  sfxSwipe();
  for (let k = 0; k < 10; k++) {
    const a = Math.atan2(-dy, -dx) + (Math.random() - 0.5) * 1.2, sp = 150 + Math.random() * 250;
    spawn(comet.x - dx * R, comet.y - dy * R, Math.cos(a) * sp, Math.sin(a) * sp, 0.35, 3 + Math.random() * 3, '#ffd27a');
  }
}

// ---------------------------------------------------------------------------
// Physics
// ---------------------------------------------------------------------------
function circleRect(x, y, r) {
  const cx = Math.max(r.x, Math.min(x, r.x + r.w)), cy = Math.max(r.y, Math.min(y, r.y + r.h));
  const ddx = x - cx, ddy = y - cy, d2 = ddx * ddx + ddy * ddy;
  if (d2 > 1e-9) { const d = Math.sqrt(d2); return { d, nx: ddx / d, ny: ddy / d, px: cx, py: cy }; }
  // centre inside the rect: push out along the shallowest side
  const l = x - r.x, rt = r.x + r.w - x, t = y - r.y, b = r.y + r.h - y, m = Math.min(l, rt, t, b);
  if (m === l) return { d: -l, nx: -1, ny: 0, px: r.x, py: y };
  if (m === rt) return { d: -rt, nx: 1, ny: 0, px: r.x + r.w, py: y };
  if (m === t) return { d: -t, nx: 0, ny: -1, px: x, py: r.y };
  return { d: -b, nx: 0, ny: 1, px: x, py: r.y + r.h };
}

function reflect(nx, ny, e, keepT) {
  let vx = comet.dx * comet.s, vy = comet.dy * comet.s;
  const vn = vx * nx + vy * ny;
  if (vn >= 0) return 0;
  const tx = vx - vn * nx, ty = vy - vn * ny;
  vx = tx * keepT - vn * e * nx; vy = ty * keepT - vn * e * ny;
  const s = Math.hypot(vx, vy);
  if (s > 1e-6) { comet.dx = vx / s; comet.dy = vy / s; }
  comet.s = s;
  return -vn;
}

function collide() {
  for (const w of walls) {
    const c = circleRect(comet.x, comet.y, w);
    if (c.d < R) {
      comet.x += c.nx * (R - c.d); comet.y += c.ny * (R - c.d);
      const impact = reflect(c.nx, c.ny, T.bounce, T.tangent);
      if (impact > 0) onBounce(c.nx, c.ny, impact, c.px, c.py);
    }
  }
  for (let k = 0; k < room.bumpers.length; k++) {
    const [bx, by] = room.bumpers[k];
    const dx = comet.x - bx, dy = comet.y - by, d = Math.hypot(dx, dy);
    if (d < R + BUMPER_R && d > 1e-6) {
      const nx = dx / d, ny = dy / d;
      comet.x = bx + nx * (R + BUMPER_R); comet.y = by + ny * (R + BUMPER_R);
      reflect(nx, ny, 1, 1);
      comet.s = Math.max(comet.s, T.bumper);
      bumpFlash[k] = 1;
      onBounce(nx, ny, 1200, bx + nx * BUMPER_R, by + ny * BUMPER_R, true);
    }
  }
  for (const sp of room.spikes) {
    if (circleRect(comet.x, comet.y, sp).d < R - 4) { die(); return; }
  }
  if (Math.hypot(comet.x - room.goal[0], comet.y - room.goal[1]) < GOAL_R) clear();
}

function physics(dt) {
  if (comet.s <= 0) return;
  let inNeb = false;
  for (const n of room.neb) if (comet.x > n.x && comet.x < n.x + n.w && comet.y > n.y && comet.y < n.y + n.h) { inNeb = true; break; }
  const kd = inNeb ? T.nebDrag : 1, kc = inNeb ? T.nebDecel : 1;
  comet.s -= (T.drag * kd * comet.s + T.decel * kc) * dt;   // gradual slow-down since the swipe
  if (comet.s < T.stop) { comet.s = 0; return; }
  const dist = comet.s * dt, n = Math.max(1, Math.ceil(dist / (R / 3)));
  for (let i = 0; i < n && state === 'play'; i++) {
    comet.x += comet.dx * dist / n; comet.y += comet.dy * dist / n;
    collide();
  }
}

function onBounce(nx, ny, impact, px, py, bumper) {
  if (impact < 60) return;
  comet.chain++;
  comet.sq = Math.min(0.38, impact / 2600); comet.sqNx = nx; comet.sqNy = ny;
  trauma = Math.min(1, trauma + Math.min(0.35, impact / 4500));
  bumper ? sfxBumper() : sfxBounce(comet.chain, impact);
  const cnt = Math.min(14, 4 + (impact / 120) | 0);
  for (let k = 0; k < cnt; k++) {
    const a = Math.atan2(ny, nx) + (Math.random() - 0.5) * 2.2, sp = 120 + Math.random() * impact * 0.35;
    spawn(px, py, Math.cos(a) * sp, Math.sin(a) * sp, 0.3 + Math.random() * 0.2, 2 + Math.random() * 3, bumper ? '#7af0ff' : '#c8c4ff');
  }
}

function die() {
  state = 'dead'; stateT = 0; deaths++;
  trauma = Math.min(1, trauma + 0.6);
  sfxDeath();
  for (let k = 0; k < 46; k++) {
    const a = Math.random() * Math.PI * 2, sp = 100 + Math.random() * 600;
    spawn(comet.x, comet.y, Math.cos(a) * sp + comet.dx * comet.s * 0.2, Math.sin(a) * sp + comet.dy * comet.s * 0.2,
      0.5 + Math.random() * 0.5, 2 + Math.random() * 5, Math.random() < 0.5 ? '#ffd27a' : '#ff6f91');
  }
  comet.s = 0;
}

function clear() {
  state = 'clear'; stateT = 0;
  clearStars = swipes <= room.par ? 3 : swipes <= room.par + 2 ? 2 : 1;
  if (!best[roomIdx] || clearStars > best[roomIdx]) { best[roomIdx] = clearStars; saveBest(); }
  trauma = Math.min(1, trauma + 0.25);
  sfxClear();
}

// ---------------------------------------------------------------------------
// Juice helpers (no hit-stop / freeze frames)
// ---------------------------------------------------------------------------
function spawn(x, y, vx, vy, life, size, color) {
  if (particles.length > 400) particles.shift();
  particles.push({ x, y, vx, vy, life, max: life, size, color });
}

function update(dt) {
  time += dt; stateT += dt;
  if (state === 'play') physics(dt);
  else if (state === 'dead' && stateT > 0.6) loadRoom(roomIdx);
  else if (state === 'clear') {
    comet.x += (room.goal[0] - comet.x) * Math.min(1, dt * 10);
    comet.y += (room.goal[1] - comet.y) * Math.min(1, dt * 10);
    comet.scale = Math.max(0, 1 - stateT * 2.2);
    if (Math.random() < 0.6) {
      const a = Math.random() * Math.PI * 2;
      spawn(room.goal[0] + Math.cos(a) * 70, room.goal[1] + Math.sin(a) * 70, -Math.cos(a) * 160, -Math.sin(a) * 160, 0.4, 3, '#b68cff');
    }
    if (stateT > 1.9) loadRoom(roomIdx + 1);
  }
  // trail
  if (state === 'play' && comet.s > 0) {
    trail.push({ x: comet.x, y: comet.y, s: comet.s });
    if (trail.length > 34) trail.shift();
  } else if (trail.length && (time * 60 | 0) % 2 === 0) trail.shift();
  comet.sq *= Math.exp(-14 * dt);
  comet.stretch *= Math.exp(-10 * dt);
  trauma = Math.max(0, trauma - dt * 2.2);
  for (let k = 0; k < bumpFlash.length; k++) bumpFlash[k] = Math.max(0, bumpFlash[k] - dt * 4);
  for (let k = particles.length - 1; k >= 0; k--) {
    const p = particles[k];
    p.life -= dt; if (p.life <= 0) { particles.splice(k, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-3 * dt); p.vy *= Math.exp(-3 * dt);
  }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  cv.width = W; cv.height = H; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  S = Math.min(W / SW, H / SH); OX = (W - SW * S) / 2; OY = (H - SH * S) / 2;
}
addEventListener('resize', resize); resize();

const bgStars = [];
for (let k = 0; k < 260; k++) bgStars.push([Math.random() * 2400 - 840, Math.random() * 3000 - 860, Math.random() * 1.8 + 0.4, Math.random() * 6]);

function drawSpikes(r) {
  ctx.fillStyle = '#ff4f7a'; ctx.strokeStyle = '#ffb3c6'; ctx.lineWidth = 2;
  const horiz = r.w >= r.h, len = horiz ? r.w : r.h, th = horiz ? r.h : r.w;
  const n = Math.max(1, Math.round(len / th)), step = len / n;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = i * step;
    if (horiz) {
      const x = r.x + a, cy = r.y + r.h / 2;
      ctx.moveTo(x, cy); ctx.lineTo(x + step / 2, r.y - 4); ctx.lineTo(x + step, cy); ctx.lineTo(x + step / 2, r.y + r.h + 4); ctx.closePath();
    } else {
      const y = r.y + a, cx = r.x + r.w / 2;
      ctx.moveTo(cx, y); ctx.lineTo(r.x - 4, y + step / 2); ctx.lineTo(cx, y + step); ctx.lineTo(r.x + r.w + 4, y + step / 2); ctx.closePath();
    }
  }
  ctx.fill(); ctx.stroke();
}

function drawStar(x, y, r, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0b2a'); g.addColorStop(1, '#251246');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const sh = trauma * trauma * 16;
  ctx.setTransform(S, 0, 0, S, OX + (Math.random() - 0.5) * sh * S, OY + (Math.random() - 0.5) * sh * S);

  for (const [x, y, r, ph] of bgStars) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * 1.5 + ph);
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, r, r);
  }
  ctx.globalAlpha = 1;

  // floor
  ctx.fillStyle = '#14123c'; ctx.fillRect(20, 120, 680, 1140);

  // nebulae
  for (const n of room.neb) {
    ctx.fillStyle = 'rgba(150,80,220,0.22)'; ctx.fillRect(n.x, n.y, n.w, n.h);
    ctx.save(); ctx.beginPath(); ctx.rect(n.x, n.y, n.w, n.h); ctx.clip();
    for (let i = 0; i < 7; i++) {
      const bx = n.x + ((i * 97 + time * 12 * (i % 2 ? 1 : -1)) % n.w + n.w) % n.w, by = n.y + (i * 53) % n.h;
      ctx.fillStyle = 'rgba(190,120,255,0.13)'; ctx.beginPath(); ctx.arc(bx, by, 50 + (i % 3) * 22, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // goal (wormhole)
  const [gx, gy] = room.goal;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.strokeStyle = i % 2 ? '#7af0ff' : '#b68cff'; ctx.lineWidth = 5 - i;
    const rr = GOAL_R + 14 - i * 11 + Math.sin(time * 3 + i) * 2;
    ctx.arc(gx, gy, rr, time * (2 + i) + i, time * (2 + i) + i + Math.PI * 1.4); ctx.stroke();
  }
  ctx.fillStyle = '#05051a'; ctx.beginPath(); ctx.arc(gx, gy, 12, 0, Math.PI * 2); ctx.fill();

  // walls
  for (const w of walls) {
    ctx.fillStyle = '#2d2a66'; ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = '#5e59c4'; ctx.fillRect(w.x, w.y, w.w, 4);
  }
  for (const sp of room.spikes) drawSpikes(sp);

  // bumpers
  room.bumpers.forEach(([bx, by], k) => {
    const f = bumpFlash[k], r = BUMPER_R * (1 + f * 0.25);
    ctx.fillStyle = f > 0 ? `rgb(${120 + 135 * f | 0},240,255)` : '#2bb6d6';
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#bff7ff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, by, r - 8, 0, Math.PI * 2); ctx.stroke();
  });

  // trail
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i], t = i / trail.length;
    ctx.strokeStyle = `rgba(255,${180 + 60 * t | 0},${90 + 120 * t | 0},${t * 0.85})`;
    ctx.lineWidth = R * 1.5 * t; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // comet
  if (state !== 'dead') drawComet();

  // tutorial hand on room 1
  if (roomIdx === 0 && swipes === 0 && state === 'play') {
    const t = (time % 1.4) / 1.4, ease = 1 - Math.pow(1 - Math.min(1, t * 1.4), 3);
    const hx = comet.x + 60, hy = comet.y + 40 - ease * 260;
    ctx.globalAlpha = t < 0.8 ? 0.9 : (1 - t) * 4.5;
    ctx.strokeStyle = '#ffffff66'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(comet.x + 60, comet.y + 40); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy, 18, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // HUD (not shaken)
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 34px system-ui, sans-serif'; ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText(`${roomIdx + 1}/${ROOMS.length}`, 28, 52);
  ctx.font = '22px system-ui, sans-serif'; ctx.fillStyle = '#ff8fab'; ctx.fillText(`✖ ${deaths}`, 120, 54);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText(`${swipes} / ${room.par}`, 360, 40);
  const live = swipes <= room.par ? 3 : swipes <= room.par + 2 ? 2 : 1;
  for (let i = 0; i < 3; i++) drawStar(326 + i * 34, 76, 13, i < live ? '#ffd84a' : '#3a3770');
  // restart button
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(660, 52, 20, -0.4, Math.PI * 1.55); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(682, 38); ctx.lineTo(682, 56); ctx.lineTo(664, 46); ctx.closePath(); ctx.fill();
  // best stars per room
  for (let i = 0; i < ROOMS.length; i++) {
    ctx.fillStyle = i === roomIdx ? '#fff' : best[i] ? '#ffd84a' : '#3a3770';
    ctx.beginPath(); ctx.arc(440 + i * 9.5, 52, i === roomIdx ? 4.5 : 3.2, 0, Math.PI * 2); ctx.fill();
  }

  if (state === 'clear') {
    const t = stateT;
    ctx.fillStyle = `rgba(10,8,30,${Math.min(0.55, t)})`; ctx.fillRect(-1000, -1000, 3000, 4000);
    for (let i = 0; i < 3; i++) {
      const k = Math.max(0, Math.min(1, (t - 0.35 - i * 0.18) * 6));
      if (k <= 0) continue;
      const pop = k < 1 ? k * 1.25 : 1;
      drawStar(250 + i * 110, 600 - (i === 1 ? 30 : 0), 46 * pop, i < clearStars ? '#ffd84a' : '#3a3770', '#fff');
    }
  }
}

function drawComet() {
  ctx.save();
  ctx.translate(comet.x, comet.y);
  const sc = comet.scale;
  ctx.scale(sc, sc);
  // glow
  const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, R * 2.4);
  gl.addColorStop(0, 'rgba(255,220,140,0.55)'); gl.addColorStop(1, 'rgba(255,140,80,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, R * 2.4, 0, Math.PI * 2); ctx.fill();
  // squash along the bounce normal, stretch along motion
  ctx.save();
  if (comet.sq > 0.01) {
    ctx.rotate(Math.atan2(comet.sqNy, comet.sqNx));
    ctx.scale(1 - comet.sq, 1 + comet.sq * 0.7);
    ctx.rotate(-Math.atan2(comet.sqNy, comet.sqNx));
  }
  const st = comet.stretch * 0.35 + Math.min(0.15, comet.s / 10000);
  ctx.rotate(Math.atan2(comet.dy, comet.dx));
  ctx.scale(1 + st, 1 - st * 0.6);
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.arc(-4, 3, R * 0.72, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // eyes look where it's heading
  const ex = comet.dx * 6, ey = comet.dy * 6;
  ctx.fillStyle = '#2a1840';
  ctx.beginPath(); ctx.arc(-7 + ex, -3 + ey, 3.6, 0, Math.PI * 2); ctx.arc(7 + ex, -3 + ey, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Audio (synthesized, created on first input)
// ---------------------------------------------------------------------------
let AC = null, master = null, noiseBuf = null;
function unlockAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type, vol, f2, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, f1, f2) {
  if (!AC) return;
  const t = AC.currentTime, src = AC.createBufferSource(), flt = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; flt.type = 'bandpass'; flt.Q.value = 1.2;
  flt.frequency.setValueAtTime(f1, t); flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(master); src.start(t); src.stop(t + dur);
}
function sfxSwipe() { noise(0.16, 0.35, 700, 2600); tone(300, 0.12, 'triangle', 0.08, 600); }
function sfxBounce(chain, impact) { const f = 440 * Math.pow(1.122, Math.min(chain - 1, 12)); tone(f, 0.16, 'sine', Math.min(0.35, 0.08 + impact / 4000)); tone(f * 2, 0.08, 'triangle', 0.05); }
function sfxBumper() { tone(220, 0.22, 'square', 0.12, 660); }
function sfxDeath() { tone(160, 0.35, 'sawtooth', 0.2, 40); noise(0.4, 0.5, 1800, 200); }
function sfxClear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.16, 0, i * 0.08)); }

// ---------------------------------------------------------------------------
// Input: swipe fires mid-drag (snappy), keep dragging to turn again
// ---------------------------------------------------------------------------
let ptr = null;
function toWorld(e) { return [(e.clientX * DPR - OX) / S, (e.clientY * DPR - OY) / S]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio();
  const [wx, wy] = toWorld(e);
  if (Math.hypot(wx - 660, wy - 52) < 44) { loadRoom(roomIdx); return; }
  if (state === 'clear' && stateT > 0.5) { loadRoom(roomIdx + 1); return; }
  ptr = { id: e.pointerId, ax: e.clientX, ay: e.clientY, ldx: 0, ldy: 0, fired: false };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.ax, dy = e.clientY - ptr.ay, l = Math.hypot(dx, dy);
  if (l < T.swipePx) return;
  const [nx, ny] = snapDir(dx / l, dy / l);
  const diff = Math.acos(Math.max(-1, Math.min(1, nx * ptr.ldx + ny * ptr.ldy))) * 180 / Math.PI;
  const turned = T.snap ? diff > 1 : diff > T.turnDeg;
  if (!ptr.fired || turned) { swipe(dx, dy); ptr.ldx = nx; ptr.ldy = ny; ptr.fired = true; }
  ptr.ax = e.clientX; ptr.ay = e.clientY;
});
const endPtr = e => { if (ptr && e.pointerId === ptr.id) ptr = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());

const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
const held = new Set(); let keyTimer = 0;
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  unlockAudio();
  if (KEYS[e.code]) {
    e.preventDefault(); if (e.repeat) return;
    held.add(e.code);
    if (!keyTimer) keyTimer = setTimeout(() => {   // 45 ms window to combine two keys into a diagonal
      keyTimer = 0; let x = 0, y = 0;
      held.forEach(c => { x += KEYS[c][0]; y += KEYS[c][1]; });
      if (x || y) swipe(x, y);
    }, 45);
  } else if (e.code === 'KeyR') loadRoom(roomIdx);
  else if (e.code === 'KeyN') loadRoom(roomIdx + 1);
  else if (e.code === 'KeyB') loadRoom(roomIdx - 1);
  else if (e.code === 'Backquote') togglePanel();
  else if ((e.code === 'Space' || e.code === 'Enter') && state === 'clear') { e.preventDefault(); loadRoom(roomIdx + 1); }
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());

// ---------------------------------------------------------------------------
// Tuning panel
// ---------------------------------------------------------------------------
const SPEC = [
  ['speed', 'Launch speed (u/s)', 600, 2800, 10],
  ['drag', 'Slow-down, exponential (/s)', 0, 3, 0.05],
  ['decel', 'Slow-down, constant (u/s²)', 0, 800, 10],
  ['stop', 'Stop below (u/s)', 0, 200, 5],
  ['bounce', 'Wall bounce', 0, 1.2, 0.02],
  ['tangent', 'Wall slide kept', 0.5, 1, 0.01],
  ['bumper', 'Bumper speed (u/s)', 600, 2800, 10],
  ['nebDrag', 'Nebula drag ×', 1, 10, 0.5],
  ['nebDecel', 'Nebula decel ×', 1, 10, 0.5],
  ['swipePx', 'Swipe length to fire (px)', 6, 80, 1],
  ['turnDeg', 'Turn angle while dragging (°)', 5, 90, 1],
];
const panel = document.getElementById('panel');
function glide() {
  const v = T.speed, k = T.drag, c = T.decel;
  if (k <= 0) return c > 0 ? v * v / (2 * c) : Infinity;
  if (c <= 0) return v / k;
  return v / k - c / (k * k) * Math.log(1 + k * v / c);
}
function buildPanel() {
  panel.innerHTML = '<b>Feel tuning</b> <span style="opacity:.6">(` to toggle)</span>';
  for (const [key, label, min, max, step] of SPEC) {
    const lab = document.createElement('label'), val = document.createElement('span');
    lab.textContent = label; val.textContent = T[key]; lab.appendChild(val);
    const inp = document.createElement('input');
    Object.assign(inp, { type: 'range', min, max, step, value: T[key] });
    inp.oninput = () => { T[key] = +inp.value; val.textContent = inp.value; saveTune(); info.textContent = infoText(); };
    panel.appendChild(lab); panel.appendChild(inp);
  }
  const sel = document.createElement('select');
  [['0', 'Free angle'], ['8', '8 directions'], ['4', '4 directions']].forEach(([v, t]) => {
    const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o);
  });
  sel.value = String(T.snap); sel.onchange = () => { T.snap = +sel.value; saveTune(); };
  const lab = document.createElement('label'); lab.textContent = 'Direction'; panel.appendChild(lab); panel.appendChild(sel);
  const info = document.createElement('div'); info.className = 'info';
  const infoText = () => `One swipe glides ≈ ${Math.round(glide())} u (room is 1140 tall)`;
  info.textContent = infoText(); panel.appendChild(info);
  const row = document.createElement('div');
  const btn = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = f; row.appendChild(b); };
  btn('◀ Room', () => loadRoom(roomIdx - 1));
  btn('Room ▶', () => loadRoom(roomIdx + 1));
  btn('Reset feel', () => { Object.assign(T, DEF); saveTune(); buildPanel(); });
  btn('Clear stars', () => { best = {}; saveBest(); });
  panel.appendChild(row);
}
function togglePanel() { panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; }
document.getElementById('gear').onclick = togglePanel;
buildPanel();

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
loadRoom(0);
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  while (dt > 0) { const h = Math.min(dt, 1 / 120); update(h); dt -= h; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Hook for tools/bot.js (headless level checks).
window.__cs = { loadRoom, swipe, update, ROOMS, T, comet,
  get state() { return state; }, get swipes() { return swipes; }, get room() { return room; } };
</script>
